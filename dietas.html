<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alimentación</title>
  <link rel="stylesheet" href="css/dietas.css" />
</head>
<body>
  <header>
    <div class="container">
      <img class="logo" src="img/GYMNOW1.png">
      <nav>
        <ul>
          <li><a href="inicio.html">Inicio</a></li>
          <li><a href="rutinas.html">Entrenamiento</a></li>
          <li><a href="dietas.html" class="active">Alimentación/a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="inicio sesion.html">Cerrar Sesion</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-section">
    <div class="container">
      <h2>Alimentación</h2>
      <p>Completa la información para obtener un plan alimenticio personalizado.</p>

      <form action="tablas dietas.html"  class="form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required />

        <label for="peso">Peso (kg):</label>
        <input type="number" id="peso" name="peso" required />

        <label for="objetivo">Objetivo:</label>
        <select id="objetivo" name="objetivo" required>
          <option value="">--Selecciona una opción--</option>
          <option value="ganar_peso">Ganar peso</option>
          <option value="perder_peso">Perder peso</option>
          <option value="mantener_peso">Mantener peso</option>
        </select>

        <label for="restricciones">Restricciones alimenticias (opcional):</label>
        <input type="text" id="restricciones" name="restricciones" placeholder="Ej: sin gluten, sin lácteos" />

        <label for="comidas">Número de comidas por día:</label>
        <input type="number" id="comidas" name="comidas" min="1" max="6" required />

        <button type="submit" class="btn">Generar dieta</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 GymNOW. Todos los derechos reservados.</p>
    </div>
  </footer>
</body>
</html>
