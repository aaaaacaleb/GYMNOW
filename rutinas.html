<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrenamiento</title>
  <link rel="stylesheet" href="css/rutinas.css" />
</head>
<body>
  <header>
    <div class="container">
      <img class="logo" src="img/GYMNOW1.png">
      <nav>
        <ul>
          <li><a href="inicio.html">Inicio</a></li>
          <li><a href="rutinas.html" class="active">Entrenamiento</a></li>
          <li><a href="dietas.html">Alimentación</a></li>
          <li><a href="contacto.html">Contacto</a></li>
          <li><a href="inicio sesion.html">Cerrar Sesion</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-section">
    <div class="container">
      <h2>Entrenamiento</h2>
      <p>Completa la información para generar tu rutina personalizada.</p>

      <form action="tablas rutinas.html" class="form">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required />

        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad" required />

        <label for="objetivo">Objetivo:</label>
        <select id="objetivo" name="objetivo" required>
          <option value="">--Selecciona una opción--</option>
          <option value="ganar_masa">Ganar masa muscular</option>
          <option value="perder_grasa">Perder grasa</option>
          <option value="resistencia">Mejorar resistencia</option>
        </select>

        <label for="nivel">Nivel de experiencia:</label>
        <select id="nivel" name="nivel" required>
          <option value="">--Selecciona tu nivel--</option>
          <option value="principiante">Principiante</option>
          <option value="intermedio">Intermedio</option>
          <option value="avanzado">Avanzado</option>
        </select>

        <label for="dias">Días disponibles por semana:</label>
        <input type="number" id="dias" name="dias" min="1" max="7" required />

        <button type="submit" class="btn">Generar rutina</button>
      </form>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 GymNOW. Todos los derechos reservados.</p>
    </div>
  </footer>
</body>
</html>
